# @package _global_
defaults:
  - override /data: partialspoof_rawboost
  - override /trainer: gpu
  - override /model: sal/w2v2_cf

tags:
  - xlsr
  - cf
  - cmn
task_name: train
seed: 666
trainer:
  min_epochs: 30
  max_epochs: 50
  devices: 1
data:
  batch_size: 32
  num_workers: 16
model:
  mixup2: true
  mixup_ratio: 0.2
  net:
    cmn: true